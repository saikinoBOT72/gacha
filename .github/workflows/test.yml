name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 依存ゼロなので install は不要
      - name: 抽選・演出プランの統計検証
        run: node tests/run.mjs
      - name: 構文チェック
        run: |
          set -e
          for f in $(find src tests -name '*.js' -o -name '*.mjs'); do
            node --check "$f"
          done
