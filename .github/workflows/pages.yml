name: pages

# main に push されたら GitHub Pages へ静的サイトとして配信する。
# ビルド不要（外部依存ゼロ・ES Modules をそのまま配信）なので、リポジトリの中身を
# ほぼそのままアップロードするだけでよい。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする（走行中のものは完了させる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抽選・演出プランの統計検証
        run: node tests/run.mjs

      - name: 配信物を組み立てる
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/
          cp -r src styles _site/
          cp README.md _site/
          cp -r docs _site/
          # Jekyll による加工を止める（_ 始まりのファイルなどを触らせない）
          touch _site/.nojekyll

      - name: Pages の設定（未有効なら有効化する）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
